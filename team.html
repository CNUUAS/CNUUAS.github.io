<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meet the Team | CNU UAS</title>
        <meta name="description" content="Meet the officers and members of CNU UAS, Christopher Newport University's unmanned aircraft systems club.">
        <link rel="icon" type="image/png" href="assets/logos/uas-logo-small.png">
        <link rel="canonical" href="https://cnuuas.github.io/team.html">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="CNU UAS Lab">
        <meta property="og:title" content="Meet the Team | CNU UAS">
        <meta property="og:description" content="Meet the officers and members of CNU UAS.">
        <meta property="og:image" content="https://cnuuas.github.io/assets/homepage/MeetTheTeam_GroupPhotoThinned.jpg">
        <meta property="og:url" content="https://cnuuas.github.io/team.html">
        <meta name="twitter:card" content="summary_large_image">

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Shared base layout (fixed navbar, scroll behavior) -->
        <link href="css/layoutBase.css" rel="stylesheet" />

        <!-- Default Styling -->
        <link href="css/teamDefault.css" rel="stylesheet" />

        <!-- Shared mobile navbar dropdown override -->
        <link href="css/navbarCollapse.css" rel="stylesheet" />

        <!-- Accessibility primitives (skip link, focus ring) -->
        <link href="css/accessibility.css" rel="stylesheet" />
    </head>

    <body>
        <a class="skip-link" href="#main-content">Skip to main content</a>
        <!-- ========================================
        NAVBAR - Loaded from component
        To edit navbar: go to components/navbar.html
        ======================================== -->
        <div id="navbar-placeholder"></div>
        <main id="main-content">
            <div class="mainContent">
                <!-- ---------------- Team Logo ---------------- -->
                <div
                    class="container py-4 text-center"
                    style="margin-top: 60px"
                >
                    <h1 id="team" class="display-4 fw-light">The Team</h1>
                </div>

                <!-- ---------------- Team Display ---------------- -->
                <div class="teamCarouselWrapper">
                    <div
                        id="teamCarousel"
                        class="carousel slide"
                        data-bs-ride="false"
                    >
                        <div class="carousel-inner" id="team-cards"></div>
                        <button
                            class="carousel-control-prev"
                            type="button"
                            data-bs-target="#teamCarousel"
                            data-bs-slide="prev"
                        >
                            <img
                                src="assets/icons/left_arrow.png"
                                class="carousel-arrow"
                                alt="Previous"
                            />
                        </button>
                        <button
                            class="carousel-control-next"
                            type="button"
                            data-bs-target="#teamCarousel"
                            data-bs-slide="next"
                        >
                            <img
                                src="assets/icons/right_arrow.png"
                                class="carousel-arrow"
                                alt="Next"
                            />
                        </button>
                    </div>

                    <div id="desktop-team-grid" class="desktop-grid"></div>

                    <div id="popups-container"></div>
                    <!-- More Info Button -->
                    <div class="viewButtonWrapper">
                        <button
                            class="viewButton"
                            type="button"
                            id="viewButton"
                        >
                            More Info
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- ========================================
        FOOTER - Loaded from component
        To edit footer: go to components/footer.html
        ======================================== -->
        <div id="footer-placeholder"></div>

        <!-- navbar/footer scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js"></script>

        <script type="module" src="js/team.js"></script>
    </body>
</html>
