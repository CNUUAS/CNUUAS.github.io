<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The Drone | CNU UAS</title>
        <meta name="description" content="Explore the hexacopter CNU UAS designs, builds, and flies — specs, components, and an interactive 3D model.">
        <link rel="icon" type="image/png" href="assets/logos/uas-logo-small.png">
        <link rel="canonical" href="https://cnuuas.github.io/drone.html">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="CNU UAS Lab">
        <meta property="og:title" content="The Drone | CNU UAS">
        <meta property="og:description" content="Explore the hexacopter CNU UAS designs, builds, and flies.">
        <meta property="og:image" content="https://cnuuas.github.io/assets/homepage/MeetTheTeam_GroupPhotoThinned.jpg">
        <meta property="og:url" content="https://cnuuas.github.io/drone.html">
        <meta name="twitter:card" content="summary_large_image">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/accessibility.css" />
        <style>
            main {
                margin: 0;
                background: white;
                font-family: system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 20px;
            }

            .demo-box {
                width: 900px;
                max-width: 100%;
                height: 600px;
                border-radius: 18px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
            }

            iframe {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            }
        </style>
    </head>
    <body>
        <a class="skip-link" href="#main-content">Skip to main content</a>
        <div id="navbar-placeholder"></div>

        <div id="main-content" class="container py-4 text-center" style="margin-top: 60px">
            <h1 class="display-4 fw-light">Hexacopter Interactive Demo</h1>
        </div>

        <main>
            <div class="demo-box" id="demoBox">
                <iframe src="dronemodel.html" title="Hexacopter Demo"></iframe>
            </div>
        </main>

        <div id="footer-placeholder"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js"></script>
        <script>
            const demoBox = document.getElementById("demoBox");

            demoBox.addEventListener("mouseenter", () => {
                document.body.style.overflow = "hidden";
            });

            demoBox.addEventListener("mouseleave", () => {
                document.body.style.overflow = "";
            });
        </script>
    </body>
</html>
